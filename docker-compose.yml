services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: dnd_simulator, POSTGRES_USER: dnd, POSTGRES_PASSWORD: dnd}
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd_simulator"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  backend:
    build: ./backend
    env_file:
      - .env.development
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {db-data: {}}
