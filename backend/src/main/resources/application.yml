spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dnd_simulator}
    username: ${DATABASE_USERNAME:dnd}
    password: ${DATABASE_PASSWORD:dnd}
    hikari:
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DATABASE_POOL_MAX:10}
      connection-timeout: ${DATABASE_POOL_TIMEOUT:30000}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties.hibernate.format_sql: true
server:
  port: ${PORT:8080}
app:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
  jwt-access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${REFRESH_EXPIRATION_MS:1209600000}
  cookie-secure: ${COOKIE_SECURE:false}
  cookie-same-site: ${COOKIE_SAME_SITE:Strict}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  auth:
    login-attempt-limit: ${AUTH_LOGIN_ATTEMPT_LIMIT:5}
    login-window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:900}
    registration-attempt-limit: ${AUTH_REGISTRATION_ATTEMPT_LIMIT:3}
    registration-window-seconds: ${AUTH_REGISTRATION_WINDOW_SECONDS:3600}
    cleanup-delay-ms: ${AUTH_THROTTLE_CLEANUP_DELAY_MS:300000}
